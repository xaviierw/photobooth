<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photobooth</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Smile! 😊</h1>

        <video id="webcam" autoplay></video>

        <button id="capture">📸 Take Photo</button>
        <button id="refresh">🔄 Refresh</button>

        <div class="photo-strip-container">
            <div class="photo-strip">
                <img id="slot1" class="photo-slot" src="" alt="">
                <img id="slot2" class="photo-slot" src="" alt="">
                <img id="slot3" class="photo-slot" src="" alt="">
            </div>
        </div>

        <label for="backgrounds">Choose a frame background:</label>
        <select id="backgrounds">
            <option value="./img/Mofusan.png">Mofusan</option>
            <option value="./img/Sanrio.png">Sanrio</option>
        </select>

        <button id="download">Download Strip</button>
        <hr>
        <p>Photoframe style will be applied after download!</p>
    </div>
        <p>Side Project by: Xavier Wong | <a href="https://github.com/xaviierw" target="_blank">GitHub: xaviierw</a></p>


    <script src="script.js"></script>
</body>
</html>
